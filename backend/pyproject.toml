[project]
name = "excess-backend"
version = "0.1.0"
description = "Excess Budget Management — Django backend"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0,<6.0",
  "django-ninja>=1.3,<2.0",
  "django-ninja-jwt>=5.3,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "google-genai>=2.3,<3.0",
  "gunicorn>=22.0,<27.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pytest-asyncio>=0.23",
  "factory-boy>=3.3",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
